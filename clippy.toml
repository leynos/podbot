# Align with CodeScene’s ceiling
cognitive-complexity-threshold = 9     # default is 25
too-many-arguments-threshold = 4       # default is 7
too-many-lines-threshold = 70          # default is 100
excessive-nesting-threshold = 4        # default is off
# Mockall's `mock!` expands a struct with one field per mocked method, and the
# four `ContainerExecClient` methods all end in `exec`; clippy 1.99's
# `struct_field_names` reports that generated struct at the default of 3.
struct-field-name-threshold = 5        # default is 3

allow-expect-in-tests = true

