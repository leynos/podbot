name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      WHITAKER_INSTALLER_VERSION: '0.2.7'
      # Pinned rather than inherited. `generate-coverage` defaults the
      # cargo watchdog to 1800 s, sized for a cold sccache store; stating
      # the same value here means a later change to the action's default
      # cannot silently move the budget this job runs under. The measured
      # worst case for the coverage step is 487 s (run 31733608869), so
      # 1800 s is about 3.7 times the worst seen. This job passes
      # `use-cargo-nextest: 'false'`, so cargo carries no inner test
      # timer and the watchdog is the only one bounding it. The
      # environment variable wins over the action's `cargo-wait-timeout`
      # input, which is why it is set here and at job level, where every
      # step can see it.
      RUN_RUST_CARGO_WAIT_TIMEOUT: '1800'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0e3c4d24e43aa48b511d94f3b902711eb02138df
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      # The contracts read `.github/workflows` and need no Rust build, so
      # they fail fast. Unguarded and a command of its own: a step with an
      # `if:` can be skipped without failing anything, and the contract
      # suite asserts this exact step.
      - name: Workflow contracts
        run: make test-workflow-contracts
      - name: Pin, budget and placement contracts
        # Unguarded and named by its command: a step with an `if:` can be
        # skipped without failing anything, and a step matched by name
        # keeps asserting nothing if its `run:` is changed. The contract
        # next door asserts this exact command.
        run: make workflow-contracts
      - name: Format
        run: make check-fmt
      - name: Enforce en-GB-oxendict spelling
        run: make spelling
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25
        with:
          globs: |
            **/*.md
            !**/target/**
            !**/dist/**
            !**/.uv-cache/**
            !**/.uv-tools/**
      # Dependency audits report advisories against the whole lockfile, so a
      # newly published advisory would fail every Dependabot PR regardless of
      # content and deadlock auto-merge. The scheduled audit workflow covers
      # Dependabot merges instead.
      - name: Install cargo-audit
        if: github.actor != 'dependabot[bot]'
        run: cargo binstall --no-confirm cargo-audit
      - name: Setup Python for audit manifest extraction
        if: github.actor != 'dependabot[bot]'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.x'
      - name: Audit dependencies
        if: github.actor != 'dependabot[bot]'
        run: make audit
      - name: Cache Whitaker installer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.cache/cargo-binstall
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Install Whitaker
        run: |
          if ! command -v whitaker-installer >/dev/null 2>&1; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"
            else
              echo "cargo-binstall unavailable; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}"
            fi
          fi
          whitaker-installer
      - name: Lint
        run: make lint
      - name: No-CLI compile check
        run: cargo check --no-default-features
      - name: No-CLI boundary tests
        run: cargo test --no-default-features --test cli_feature_gating --test compile_contract
      - name: Internal compatibility tests
        run: cargo test --features internal
      # CodeScene coverage belongs to main (CV-005): coverage-main.yml is
      # the only workflow that talks to CodeScene. This lane keeps the
      # ratchet, which gates on this repository's own baseline, needs no
      # token, and applies to pull requests from forks too.
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@0e3c4d24e43aa48b511d94f3b902711eb02138df
        with:
          features: internal
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
      - name: Report compiler cache effectiveness
        # After the compiling steps and on failure too, because a red lane
        # is exactly when "did anything reach the cache" is worth knowing.
        # This is the evidence for the repin above: on the pins this job
        # used before, sccache was installed and started on every run and
        # Cargo routed nothing through it, so these counters were all zero
        # and nobody was looking.
        if: always()
        run: sccache --show-stats
      - name: Set up Rust for Merman
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master
        with:
          toolchain: '1.95.0'
      - name: Install Mermaid validation tools
        run: |
          uv tool install nixie-cli==1.1.0
          cargo +1.95.0 install merman-cli --version '=0.7.0' --locked
      - name: Validate Mermaid diagrams
        run: make nixie
