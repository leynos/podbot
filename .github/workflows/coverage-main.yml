name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push; pull requests only
# generate coverage in ci.yml (the changed-line `cs-coverage check` gate
# is deferred until the project's coverage-gates configuration is
# enabled — see the comment in ci.yml). This workflow also advances the
# coverage ratchet baseline: caches saved on main are readable by every
# pull-request run, so the baseline written here is the one PR ratchet
# checks compare against.

'on':
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # The same stated budget as ci.yml's build-test, for the same
      # reason: this job runs the coverage action once, with
      # `use-cargo-nextest: 'false'`, so the watchdog is the only timer
      # bounding cargo. See that job for the measurement it is sized
      # against.
      RUN_RUST_CARGO_WAIT_TIMEOUT: '1800'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0e3c4d24e43aa48b511d94f3b902711eb02138df
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@0e3c4d24e43aa48b511d94f3b902711eb02138df
        with:
          features: internal
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
      - name: Report compiler cache effectiveness
        # On failure too: a red lane is exactly when "did anything reach
        # the cache" is worth knowing.
        if: always()
        run: sccache --show-stats
      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: ${{ env.CS_ACCESS_TOKEN }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@0e3c4d24e43aa48b511d94f3b902711eb02138df
        with:
          format: lcov
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
