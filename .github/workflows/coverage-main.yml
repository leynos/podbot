name: Coverage (main)

# CodeScene coverage belongs to main (CV-005). This is the only workflow
# that talks to CodeScene: it uploads main's coverage on push, and it
# advances the coverage ratchet baseline, since caches saved on main are
# readable by every pull-request run. Pull requests gate on that ratchet
# in ci.yml and never contact CodeScene, whose token no fork can read.

'on':
  push:
    branches: [main]
  workflow_dispatch:

# A run in progress is never cancelled: a cancelled publisher abandons
# both its upload and its baseline write. GitHub keeps at most one pending
# run per group, and a run queued later replaces it, so a burst of pushes
# publishes the last one queued. Pushes to main queue in push order in
# practice; were two ever queued out of order, the baseline would lag by
# one commit until the next push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    # Ubicloud's cache proxy is scoped by ref, so a pull request's Ubicloud
    # build-test reads a warm main scope only if a main job on Ubicloud
    # writes it. This is that writer. The fork arm never applies on push or
    # dispatch; it is kept so every Ubicloud lane reads the same way.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # An Ubicloud runner is a self-hosted just-in-time runner with no
    # six-hour hosted cap. Provisional: sized for the first, cold run on
    # Ubicloud, and held 15 minutes above the 1,800 s cargo watchdog below so
    # the watchdog, not this ceiling, ends a stalled run and the diagnostics
    # after the coverage step still run. Tightened to twice a measured warm
    # Ubicloud run once one exists, and never below the watchdog plus setup.
    timeout-minutes: 45
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # The same stated budget as ci.yml's build-test, for the same
      # reason: this job runs the coverage action once, with
      # `use-cargo-nextest: 'false'`, so the watchdog is the only timer
      # bounding cargo. See that job for the measurement it is sized
      # against.
      RUN_RUST_CARGO_WAIT_TIMEOUT: '1800'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        id: setup-rust
        uses: leynos/shared-actions/.github/actions/setup-rust@03ef8cdcea566bd1d34fac511f27928cf763c7d5
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@03ef8cdcea566bd1d34fac511f27928cf763c7d5
        with:
          features: internal
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
      - name: Report compiler cache effectiveness
        # On failure too: a red lane is exactly when "did anything reach
        # the cache" is worth knowing.
        if: always()
        run: sccache --show-stats
      - name: Write compiler cache statistics
        # The JSON form of the report above, for the health check below.
        if: always()
        run: sccache --show-stats --stats-format json > sccache-stats.json
      - name: Check compiler cache health
        # Fails a structurally broken integration: the wrong backend, nothing
        # wrapped, or every store or read failing. Isolated write or read
        # errors only warn, because a cache hiccup costs one compile and must
        # not turn a pull request red.
        # Skipped when setup-rust fell back to no compiler cache after its
        # server would not start: the wrapper is cleared then, so the check
        # would report that nothing was wrapped and turn the job red, hiding
        # a fallback the action already announced as an annotation and in the
        # job summary. The next step keeps the skip visible.
        if: always() && steps.setup-rust.outputs.sccache-status != 'fallback'
        run: python3 scripts/check_sccache_health.py --expect-location ghac sccache-stats.json
      - name: Note the skipped compiler cache health check
        if: always() && steps.setup-rust.outputs.sccache-status == 'fallback'
        run: echo "::notice title=sccache fallback::compiler cache health check skipped because setup-rust fell back to no cache for this job"
      - name: Check for the CodeScene token
        # GitHub evaluates the expression before the shell starts, so this
        # step's shell receives only `true` or `false`, and the token is in
        # no step's env. Only the upload action receives it, through its
        # `access-token` input: the action is composite and would hand its
        # own step's env to every step nested inside it.
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        # A dispatch can name any branch, so the ref is checked here, not
        # only in the trigger filter. A fork or a rotated secret skips the
        # upload instead of failing the run.
        id: codescene-upload
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@03ef8cdcea566bd1d34fac511f27928cf763c7d5
        with:
          format: lcov
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
      - name: Record the CodeScene upload decision
        # A skipped upload looks the same whatever skipped it, so the job
        # summary records the inputs to the decision and its outcome. Every
        # value is an expression result from a closed set, so the record
        # holds no secret and nothing a branch name could inject.
        if: always()
        run: echo "operation=codescene_upload token_available=${{ steps.codescene-token.outputs.available || 'unknown' }} ref_is_main=${{ github.ref == 'refs/heads/main' }} upload_outcome=${{ steps.codescene-upload.outcome || 'not_run' }}" >> "$GITHUB_STEP_SUMMARY"
